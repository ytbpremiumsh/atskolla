name: Build ATSkolla Parent APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-parent/**', '.github/workflows/android-parent.yml']
  pull_request:
    paths: ['android-parent/**', '.github/workflows/android-parent.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint
        working-directory: android-parent
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ATSkolla-Parent-debug
          path: android-parent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  visual-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ATSkolla-Parent-debug
          path: apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p previews
            adb install apk/app-debug.apk
            adb shell am start -W -n com.atskolla.parent/.BrandPreviewActivity
            adb shell screencap -p /sdcard/loading.png
            adb pull /sdcard/loading.png previews/loading.png
            adb shell am force-stop com.atskolla.parent
            adb shell am start -W -n com.atskolla.parent/.BrandPreviewActivity --ez preview_error true
            adb shell screencap -p /sdcard/connection.png
            adb pull /sdcard/connection.png previews/connection.png
            adb shell am force-stop com.atskolla.parent
            adb shell am start -W -n com.atskolla.parent/.MainActivity
            sleep 15
            adb shell screencap -p /sdcard/webview.png
            adb pull /sdcard/webview.png previews/webview.png
            adb logcat -d -b crash > previews/crash-log.txt
            test ! -s previews/crash-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ATSkolla-Android-previews
          path: previews
