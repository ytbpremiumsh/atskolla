name: Web quality checks
on:
  push:
    branches: [main]
    paths: ['src/**', 'package*.json', '.github/workflows/web-quality.yml']
  pull_request:
    paths: ['src/**', 'package*.json', '.github/workflows/web-quality.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test
      - run: npm run build
