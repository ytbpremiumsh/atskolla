# aaPanel/Nginx HTTP virtual host: SCHOOL SUBDOMAINS ONLY.
# Add wildcard TLS through aaPanel before enabling public HTTPS traffic.
server {
    listen 80;
    server_name *.atskolla.com;
    root /www/wwwroot/atskolla-schools/current;
    index index.html;

    # Do not serve apex, nested hostnames, main site, APIs, or mail from this vhost.
    if ($host !~* "^[a-z0-9][a-z0-9-]*[a-z0-9]\.atskolla\.com$") { return 404; }
    if ($host ~* "^(www|app|api|admin|mail|email|smtp|imap|pop|cdn|assets|static|status|support|help|docs|blog|wa|whatsapp|dev|staging)\.atskolla\.com$") { return 404; }

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/atskolla-schools/acme;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location ^~ /assets/ {
        alias /www/wwwroot/atskolla-schools/shared-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }
    location = / { return 302 https://www.atskolla.com; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /atskolla-release.json { add_header Cache-Control "no-store"; }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
}
