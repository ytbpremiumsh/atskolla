name: ATSkolla Guru Native
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-teacher/**', 'android-native/app/src/main/res/**', 'android-native/app/src/main/assets/api.json', '.github/workflows/android-teacher.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Compile native Guru APK, release bundle and lint
        working-directory: android-teacher
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ATSkolla-Guru-build
          path: |
            android-teacher/app/build/outputs/apk/**/*.apk
            android-teacher/app/build/outputs/bundle/**/*.aab
            android-teacher/app/build/reports/lint-results-release.*
  native-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: ATSkolla-Guru-build, path: build}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash android-teacher/scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ATSkolla-Guru-previews, path: previews}
